name: Task
description: Track a small implementation or cleanup task
title: "[Task] "
labels:
  - task
body:
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What files or behavior should change?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: |
        - Build passes
        - PR reviewed
        - No unrelated files changed
    validations:
      required: true
